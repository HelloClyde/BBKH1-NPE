name: Build and release H1 NPE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned dependencies and GNU MIPS toolchain
        run: |
          python -m pip install -r tests/requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/install_toolchain.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build, verify and execute the release MIPS binary
        run: |
          python tools/build.py --toolchain .tools/toolchain/bin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/verify_release.py --require-verified
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/ci_smoke.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $firstBda = (Get-FileHash dist/H1NPE.bda -Algorithm SHA256).Hash
          $firstZip = (Get-FileHash dist/H1NPE-install.zip -Algorithm SHA256).Hash
          python tools/build.py --toolchain .tools/toolchain/bin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash dist/H1NPE.bda -Algorithm SHA256).Hash -ne $firstBda) { throw 'BDA is not reproducible' }
          if ((Get-FileHash dist/H1NPE-install.zip -Algorithm SHA256).Hash -ne $firstZip) { throw 'Install ZIP is not reproducible' }
      - name: Package installer, complete source and checksums
        run: |
          python tools/package_release.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: H1-NPE-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: H1-NPE-release
          path: dist/release
      - name: Verify exact downloaded assets and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          python tools/package_release.py --verify
          cd dist/release
          sha256sum --check SHA256SUMS.txt
          cd ../..
          gh release create "$RELEASE_TAG" dist/release/* --verify-tag --prerelease --title "诺亚舟NPE $RELEASE_TAG" --notes-file docs/release-v0.1.0.md
